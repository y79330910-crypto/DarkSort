[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darksort"
version = "0.13.1"
description = "Darkest Dungeon 1 local mod profile manager for Windows"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "defusedxml>=0.7,<1",
  "platformdirs>=4,<5",
  "vdf>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6,<7", "ruff>=0.9,<1"]

[project.gui-scripts]
darksort = "darksort.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
